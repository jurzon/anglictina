name = "anglictina-ai"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
# Odkiaľ môže appka volať (localhost je povolený vždy). Viac adries oddeľ čiarkou.
ALLOWED_ORIGINS = "https://jurzon.github.io"
# Denné limity: z jednej IP adresy a spolu za všetkých.
PER_IP_DAY = "20"
TOTAL_DAY = "300"
# Kontrola jednej vety (keď sa odpoveď líši od vzoru) – lacnejšia, preto vyššie limity.
CHECK_PER_IP_DAY = "150"
CHECK_TOTAL_DAY = "1000"

# Počítadlá denných limitov (npx wrangler kv namespace create LIMITS)
[[kv_namespaces]]
binding = "LIMITS"
id = "d266d8047f3a4cbfabf60deb1cd6af16"
